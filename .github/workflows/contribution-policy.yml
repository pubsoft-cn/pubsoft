name: Contribution policy

on:
  pull_request:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    # Only auto-close external-human PRs: collaborators, members and bots
    # (dependabot opens dependency PRs) must never be touched.
    if: >-
      github.event.pull_request.author_association != 'OWNER' &&
      github.event.pull_request.author_association != 'COLLABORATOR' &&
      github.event.pull_request.author_association != 'MEMBER' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    steps:
      - name: Comment and close
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --body "This repository does not accept pull requests. Please send patches to **pubsoft@gmail.com** (see CONTRIBUTING.md)."
          gh pr close ${{ github.event.pull_request.number }}
