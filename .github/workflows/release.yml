name: Release

# Tag-driven publish: v0.1.0-alpha.N → pack → nuget.org (+ optional internal feed).
# Secrets: NUGET_ORG_API_KEY (required), PUBSOFT_NUGET_URL + NUGET_API_KEY (internal, optional).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Pack
        run: dotnet pack PubSoft.sln -c Release -o feed

      - name: Verify package consumer smoke
        run: bash scripts/verify-package-consumer.sh feed

      - name: Push to nuget.org
        env:
          NUGET_ORG_API_KEY: ${{ secrets.NUGET_ORG_API_KEY }}
        run: bash scripts/push-nuget-org.sh feed

      - name: Push to internal feed (optional)
        if: ${{ secrets.PUBSOFT_NUGET_URL != '' }}
        env:
          PUBSOFT_NUGET_URL: ${{ secrets.PUBSOFT_NUGET_URL }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: bash scripts/push-internal-feed.sh feed
