name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      PUBSOFT_REDIS: localhost:7000,abortConnect=false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Secret scan
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git --no-banner --redact /repo
      - name: Internal identifier scan
        env:
          # Org-private token lists live in repository secrets or variables —
          # never in the repo, where they would leak the identifiers they guard
          # against. STRICT applies to every tracked file; EXCLUDING_TESTS skips
          # tests/ (unit tests legitimately embed RFC1918 fixtures).
          STRICT: ${{ secrets.PUBSOFT_FORBIDDEN_PATTERNS || vars.PUBSOFT_FORBIDDEN_PATTERNS }}
          EXCLUDING_TESTS: ${{ secrets.PUBSOFT_FORBIDDEN_PATTERNS_EXCLUDING_TESTS || vars.PUBSOFT_FORBIDDEN_PATTERNS_EXCLUDING_TESTS }}
        run: |
          if [ -z "$STRICT" ] && [ -z "$EXCLUDING_TESTS" ]; then
            echo "::warning::identifier patterns not configured in repository variables — scan skipped"
            exit 0
          fi
          report_hits() {
            local patterns="$1"; shift
            local hits
            hits=$(grep -lE "$patterns" "$@" 2>/dev/null || true)
            if [ -n "$hits" ]; then
              echo "Forbidden internal identifiers found in tracked files:"
              echo "$hits" | while IFS= read -r f; do
                echo "  $f"
                grep -nE "$patterns" -- "$f" | head -3 | sed 's/^/    /'
              done
              return 1
            fi
          }
          mapfile -d '' files < <(git ls-files -z)
          failed=0
          if [ -n "$STRICT" ]; then
            report_hits "$STRICT" "${files[@]}" || failed=1
          fi
          if [ -n "$EXCLUDING_TESTS" ]; then
            non_test=()
            for f in "${files[@]}"; do [[ "$f" == tests/* ]] || non_test+=("$f"); done
            if ((${#non_test[@]})); then
              report_hits "$EXCLUDING_TESTS" "${non_test[@]}" || failed=1
            fi
          fi
          exit $failed
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Start Redis Cluster
        run: bash scripts/start-redis-cluster.sh
      - name: Restore
        run: dotnet restore PubSoft.sln
      - name: Format check
        run: dotnet format PubSoft.sln --verify-no-changes --no-restore
      - name: Test
        run: dotnet test PubSoft.sln --no-restore --configuration Release
      - name: Pack
        run: dotnet pack PubSoft.sln --no-restore --configuration Release
      - name: Verify packed package consumer
        run: bash scripts/verify-package-consumer.sh
      - name: Verify Native AOT consumer
        run: bash scripts/verify-aot-consumer.sh
      - name: Check vulnerable dependencies
        run: dotnet list PubSoft.sln package --vulnerable --include-transitive
      - name: Stop Redis Cluster
        if: always()
        run: docker stop pubsoft-test-redis-cluster || true
