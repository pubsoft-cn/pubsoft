version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Only direct PackageReferences. Transitive pins would appear as
    # undeclared nuspec deps and fail scripts/verify-package-dependencies.py.
    allow:
      - dependency-type: direct
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.*"
          - "System.*"
    # Runtime-tracking families stay on the TargetFramework wave: these ship
    # with the shared framework, and a major bump ahead of it splits the
    # dependency graph for consumers (NU1605). Lift when targeting net11.
    # Test.Sdk stays free to move. Microsoft.CodeAnalysis.* pins track the
    # SDK compiler, not the runtime: an analyzer built against a newer
    # CodeAnalysis than the running CSC is refused (CS9057) and breaks every
    # project. Lift manually once the SDK's compiler reaches the version.
    ignore:
      - dependency-name: "Microsoft.CodeAnalysis.*"
      - dependency-name: "Microsoft.Extensions.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
