version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Only direct PackageReferences. Transitive pins would appear as
    # undeclared nuspec deps and fail scripts/verify-package-dependencies.py.
    allow:
      - dependency-type: direct
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.*"
          - "System.*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
